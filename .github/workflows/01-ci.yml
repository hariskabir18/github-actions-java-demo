name: 01 - Java CI and Publish Package

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-test-publish:
    name: Build, Test, Scan and Publish JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Generate immutable demo version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Generated package version: ${VERSION}"

      - name: Set Maven project version
        run: |
          mvn --batch-mode versions:set \
            -DnewVersion="${PACKAGE_VERSION}" \
            -DgenerateBackupPoms=false

      - name: Maven clean verify
        run: mvn --batch-mode clean verify

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3

      - name: Publish JAR to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: CI summary
        shell: bash
        run: |
          {
            echo "## Java CI completed successfully"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Package version: \`${PACKAGE_VERSION}\`"
            echo "- Artifact: \`com.demo:github-actions-demo:${PACKAGE_VERSION}\`"
            echo "- Published to: GitHub Packages Maven Registry"
          } >> "$GITHUB_STEP_SUMMARY"
