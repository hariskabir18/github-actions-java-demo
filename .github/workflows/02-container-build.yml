name: 02 - Build and Publish Container

on:
  workflow_run:
    workflows:
      - "01 - Java CI and Publish Package"
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  build-container:
    name: Download JAR, Build Image and Push to GHCR
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set build metadata
        shell: bash
        run: |
          PACKAGE_VERSION="1.0.${{ github.event.workflow_run.run_number }}"
          IMAGE_VERSION="1.0.${GITHUB_RUN_NUMBER}"
          IMAGE_TAG="poc_${IMAGE_VERSION}"

          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${IMAGE_VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "OWNER_LC=${OWNER_LC}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${OWNER_LC}/github-actions-java-demo" >> "$GITHUB_ENV"

          echo "============================================================"
          echo "                BUILD METADATA"
          echo "============================================================"
          echo "JAR Package Version : ${PACKAGE_VERSION}"
          echo "Image Version       : ${IMAGE_VERSION}"
          echo "Image Tag           : ${IMAGE_TAG}"
          echo "Image Registry      : ghcr.io"
          echo "============================================================"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Download exact JAR from GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docker-input

          echo "Downloading Maven package:"
          echo "com.demo:github-actions-demo:${PACKAGE_VERSION}"

          mvn --batch-mode dependency:get \
            -Dartifact="com.demo:github-actions-demo:${PACKAGE_VERSION}:jar" \
            -DremoteRepositories="github::default::https://maven.pkg.github.com/${GITHUB_REPOSITORY}"

          cp \
            "${HOME}/.m2/repository/com/demo/github-actions-demo/${PACKAGE_VERSION}/github-actions-demo-${PACKAGE_VERSION}.jar" \
            docker-input/github-actions-demo.jar

          echo
          echo "Downloaded package:"
          ls -lh docker-input/github-actions-demo.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            APP_VERSION=${{ env.PACKAGE_VERSION }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}

      - name: Smoke-test image before pushing
        shell: bash
        run: |
          echo "Starting smoke-test container..."
          echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"

          docker run -d \
            --name pre-push-test \
            -p 18080:8080 \
            "${IMAGE_NAME}:${IMAGE_TAG}"

          cleanup() {
            echo
            echo "Container logs:"
            docker logs pre-push-test || true

            echo
            echo "Removing smoke-test container..."
            docker rm -f pre-push-test || true
          }

          trap cleanup EXIT

          echo
          echo "============================================================"
          echo "           WAITING FOR APPLICATION READINESS"
          echo "============================================================"

          for attempt in $(seq 1 30); do
            if curl -fsS \
              http://localhost:18080/actuator/health \
              >/tmp/health.json; then

              echo
              echo "Application health response:"
              cat /tmp/health.json
              echo
              echo
              echo "============================================================"
              echo "              SMOKE TEST PASSED"
              echo "============================================================"
              exit 0
            fi

            echo "Attempt ${attempt}/30 - application is not ready yet..."
            sleep 5
          done

          echo
          echo "Application failed to become healthy."
          exit 1

      - name: Push container image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            APP_VERSION=${{ env.PACKAGE_VERSION }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}

      - name: Verify published image
        shell: bash
        run: |
          echo "Verifying image availability in GHCR..."
          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

          echo
          echo "Successfully pulled:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Container build summary
        shell: bash
        run: |
          {
            echo "## Container Image Published Successfully"
            echo ""
            echo "- JAR Version: \`${PACKAGE_VERSION}\`"
            echo "- Image Version: \`${IMAGE_VERSION}\`"
            echo "- Image Tag: \`${IMAGE_TAG}\`"
            echo "- Full Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Registry: GitHub Container Registry"
            echo "- Smoke Test: PASSED"
          } >> "$GITHUB_STEP_SUMMARY"
